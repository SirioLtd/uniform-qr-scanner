<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>QR Code Scanner</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
  <style>
    body { background: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .scan-success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
    .scan-danger { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
    .scan-warning { background-color: #fff3cd; border-color: #ffeeba; color: #856404; }
    .popup-message {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      padding: 18px 28px; background-color: #ffc107; color: #333;
      border: 1px solid #ccc; border-radius: 10px; font-size: 16px;
      font-weight: bold; text-align: center; z-index: 9999; display: none;
      box-shadow: 0 4px 20px rgba(0,0,0,0.25); max-width: 90%;
    }
    .size-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 10px 0 14px; }
    .size-btn {
      padding: 10px 0; border: 2px solid #dee2e6; border-radius: 8px;
      background: #fff; font-weight: 700; font-size: 1rem; cursor: pointer; text-align: center;
    }
    .size-btn:active, .size-btn.active { background: #007bff; color: #fff; border-color: #007bff; }
    .rule-badge {
      display: inline-block; background: #e9ecef; padding: 3px 10px;
      border-radius: 20px; font-size: 12px; font-weight: 600; margin-right: 6px; margin-bottom: 4px;
    }
    .history-item {
      padding: 8px 12px; border-radius: 6px; margin-bottom: 6px;
      font-size: 14px; display: flex; justify-content: space-between; align-items: center;
    }
    #qr-reader { border: none !important; }
    #qr-reader video { border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container mt-3 mb-5" style="max-width: 560px;">

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <div>
        <h5 class="mb-1 font-weight-bold">QR Code Scanner</h5>
        <div>
          <span class="rule-badge" id="maxIdBadge">Max ID: 25025</span>
          <span class="rule-badge" id="waitBadge">Wait: 7 Days</span>
        </div>
      </div>
      <button class="btn btn-sm btn-outline-secondary" id="openSettingsBtn">Settings</button>
    </div>

    <!-- QR Camera -->
    <div class="card p-2 mb-3">
      <div id="qr-reader"></div>
    </div>

    <!-- Popup -->
    <div id="popup-message" class="popup-message"></div>

    <!-- Recent Scans -->
    <div class="card p-3 mb-3">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <small class="font-weight-bold text-muted">Recent Scans</small>
        <button class="btn btn-link btn-sm p-0 text-muted" id="clearBtn" style="font-size:12px;">Clear</button>
      </div>
      <div id="scanHistory">
        <div class="text-center text-muted py-2 small">No scans yet</div>
      </div>
    </div>

    <!-- Manual Entry -->
    <div class="card p-3 mb-3">
      <label class="small font-weight-bold text-muted mb-1">Manual ID Entry (If QR fails):</label>
      <div class="input-group">
        <input type="text" id="manualInput" class="form-control text-uppercase" placeholder="e.g. S23302">
        <div class="input-group-append">
          <button class="btn btn-secondary" id="manualSubmitBtn" type="button">Submit</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Size Modal -->
  <div class="modal fade" id="sizeModal" tabindex="-1" role="dialog" data-backdrop="static">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title font-weight-bold">Select Uniform Size</h5>
        </div>
        <div class="modal-body">
          <p class="text-muted small mb-1">Employee: <strong id="modalEmpId" class="text-dark"></strong></p>
          <label class="small font-weight-bold text-muted">Quick Select:</label>
          <div class="size-grid">
            <button type="button" class="size-btn" onclick="pickSize('XS')">XS</button>
            <button type="button" class="size-btn" onclick="pickSize('S')">S</button>
            <button type="button" class="size-btn" onclick="pickSize('M')">M</button>
            <button type="button" class="size-btn" onclick="pickSize('L')">L</button>
            <button type="button" class="size-btn" onclick="pickSize('XL')">XL</button>
            <button type="button" class="size-btn" onclick="pickSize('2XL')">2XL</button>
            <button type="button" class="size-btn" onclick="pickSize('3XL')">3XL</button>
            <button type="button" class="size-btn" onclick="pickSize('4XL')">4XL</button>
          </div>
          <label class="small font-weight-bold text-muted">Or Type:</label>
          <input type="text" id="sizeInput" class="form-control text-uppercase" placeholder="e.g. M or 38">
          <input type="hidden" id="hiddenCode">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="button" id="submitSizeBtn" class="btn btn-primary font-weight-bold">Confirm</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal fade" id="settingsModal" tabindex="-1" role="dialog">
    <div class="modal-dialog modal-dialog-centered" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title font-weight-bold">Settings</h5>
          <button type="button" class="close" data-dismiss="modal">&times;</button>
        </div>
        <div class="modal-body">
          <div class="form-group">
            <label class="font-weight-bold small">Waiting Period (Days)</label>
            <input type="number" id="setWait" class="form-control" placeholder="7" min="0" step="0.5">
            <small class="form-text text-muted">Minimum days between uniforms. 0 = no wait.</small>
          </div>
          <div class="form-group mt-3">
            <label class="font-weight-bold small">Max Allowed Employee ID</label>
            <input type="number" id="setMaxId" class="form-control" placeholder="25025">
            <small class="form-text text-muted">IDs higher than this are blocked.</small>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Close</button>
          <button type="button" id="saveSettingsBtn" class="btn btn-primary font-weight-bold">Save to Sheet</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Minimal Scripts -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.bundle.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <script>
    var API_URL = "https://script.google.com/macros/s/AKfycbyzJ0L5d95y_3lcXRHb9JMwtyaTzqEP3OJ67ZVEUQ7Z2o-Hl1iUGJbssHf7VV0o86bY/exec";
    var rules = { waitingDays: 7, maxEmployeeId: 25025 };
    var history = [];
    var busy = false;
    var scanCooldown = {};  // prevents duplicate scans: { "S23302": timestamp }
    var sizeCache = {};     // caches known sizes: { "S23302": "M" }
    var COOLDOWN_MS = 10000; // 10 seconds between same ID scans

    function api(payload) {
      return fetch(API_URL, { method: "POST", headers: { "Content-Type": "text/plain" }, body: JSON.stringify(payload) }).then(function(r) { return r.json(); });
    }

    function showMsg(msg, duration) {
      var el = document.getElementById("popup-message");
      el.textContent = msg; el.style.display = "block";
      setTimeout(function() { el.style.display = "none"; }, duration || 2500);
    }

    function addHistory(id, text, cls) {
      var t = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
      history.unshift({ id: id, text: text, cls: cls, time: t });
      if (history.length > 8) history.pop();
      var c = document.getElementById("scanHistory"); c.innerHTML = "";
      history.forEach(function(h) {
        var d = document.createElement("div");
        d.className = "history-item " + h.cls;
        d.innerHTML = "<div><strong>" + h.id + "</strong> — " + h.text + "</div><small class='text-muted'>" + h.time + "</small>";
        c.appendChild(d);
      });
    }

    function extractNum(s) { var d = String(s).replace(/\D/g, ""); return d ? parseInt(d, 10) : 0; }

    function pickSize(s) {
      document.getElementById("sizeInput").value = s;
      document.querySelectorAll(".size-btn").forEach(function(b) { b.classList.toggle("active", b.textContent === s); });
    }

    function onScan(decoded) {
      if (busy) return;
      var code = String(decoded).trim().toUpperCase();
      if (!code) return;

      // Duplicate scan prevention: same ID within cooldown period
      var now = Date.now();
      if (scanCooldown[code] && (now - scanCooldown[code]) < COOLDOWN_MS) return;
      scanCooldown[code] = now;
      busy = true;

      // Show instant feedback
      showMsg("Processing " + code + "...", 1500);

      if (rules.maxEmployeeId > 0 && extractNum(code) > rules.maxEmployeeId) {
        showMsg("Not Eligible! " + code + " exceeds limit (" + rules.maxEmployeeId + ")");
        addHistory(code, "Not Eligible", "scan-danger");
        setTimeout(function() { busy = false; }, 800);
        return;
      }

      // Check local size cache first to skip extra API call
      if (sizeCache[code]) {
        save(code, sizeCache[code]);
        return;
      }

      api({ action: "getSizeForEmployee", employeeId: code }).then(function(d) {
        if (d && d.size) {
          sizeCache[code] = d.size; // cache for future
          save(code, d.size);
        } else {
          document.getElementById("hiddenCode").value = code;
          document.getElementById("modalEmpId").textContent = code;
          document.getElementById("sizeInput").value = "";
          document.querySelectorAll(".size-btn").forEach(function(b) { b.classList.remove("active"); });
          $("#sizeModal").modal("show");
        }
      }).catch(function(e) { showMsg("Error: " + e.message); setTimeout(function() { busy = false; }, 800); });
    }

    function save(code, size) {
      api({ action: "processForm", formObject: { productCode: code, size: size } }).then(function(d) {
        var r = d.result;
        if (r === "FirstUniformGiven") { showMsg(code + " - 1st Uniform Issued (" + size + ")"); addHistory(code, "1st Uniform (" + size + ")", "scan-success"); }
        else if (r === "SecondUniformGiven") { showMsg(code + " - 2nd Uniform Issued"); addHistory(code, "2nd Uniform", "scan-success"); }
        else if (r === "ThirdUniformGiven") { showMsg(code + " - 3rd Uniform Issued"); addHistory(code, "3rd Uniform", "scan-success"); }
        else if (r === "BlockedFromSecondUniform") { showMsg(code + " - Wait period not reached for 2nd uniform"); addHistory(code, "Blocked (wait period)", "scan-warning"); }
        else if (r === "BlockedFromThirdUniform") { showMsg(code + " - Wait period not reached for 3rd uniform"); addHistory(code, "Blocked (wait period)", "scan-warning"); }
        else if (r === "AllUniformsReceived") { showMsg(code + " - Already received all uniforms!"); addHistory(code, "All received", "scan-warning"); }
        else if (r === "NotEligible") { showMsg(code + " - Not Eligible"); addHistory(code, "Not Eligible", "scan-danger"); }
        else { showMsg(r || "Error"); addHistory(code, r, "scan-warning"); }
      }).catch(function(e) { showMsg("Error: " + e.message); })
      .finally(function() { setTimeout(function() { busy = false; }, 600); });
    }

    function updateBadges() {
      document.getElementById("maxIdBadge").textContent = "Max ID: " + rules.maxEmployeeId;
      document.getElementById("waitBadge").textContent = "Wait: " + rules.waitingDays + " Days";
    }

    document.addEventListener("DOMContentLoaded", function() {
      updateBadges();

      // Load settings
      api({ action: "getSettings" }).then(function(d) {
        if (d && d.waitingDays !== undefined) { rules = d; updateBadges(); }
      }).catch(function() {});

      // QR Scanner
      new Html5QrcodeScanner("qr-reader", { fps: 15, qrbox: 250 }).render(onScan, function() {});

      // Settings
      document.getElementById("openSettingsBtn").addEventListener("click", function() {
        document.getElementById("setWait").value = rules.waitingDays;
        document.getElementById("setMaxId").value = rules.maxEmployeeId;
        $("#settingsModal").modal("show");
      });

      document.getElementById("saveSettingsBtn").addEventListener("click", function() {
        var w = parseFloat(document.getElementById("setWait").value) || 0;
        var m = parseInt(document.getElementById("setMaxId").value, 10) || 0;
        api({ action: "saveSettings", waitingDays: w, maxEmployeeId: m }).then(function() {
          rules.waitingDays = w; rules.maxEmployeeId = m;
          updateBadges(); $("#settingsModal").modal("hide"); showMsg("Settings saved!");
        }).catch(function(e) { showMsg("Save failed: " + e.message); });
      });

      // Size submit
      document.getElementById("submitSizeBtn").addEventListener("click", function() {
        var s = document.getElementById("sizeInput").value.trim();
        var c = document.getElementById("hiddenCode").value;
        if (!s) { alert("Please select or enter a size!"); return; }
        $("#sizeModal").modal("hide"); save(c, s);
      });

      // Manual
      document.getElementById("manualSubmitBtn").addEventListener("click", function() {
        var v = document.getElementById("manualInput").value.trim();
        if (v) { document.getElementById("manualInput").value = ""; onScan(v); }
      });
      document.getElementById("manualInput").addEventListener("keypress", function(e) {
        if (e.key === "Enter") document.getElementById("manualSubmitBtn").click();
      });

      // Clear
      document.getElementById("clearBtn").addEventListener("click", function() {
        history = []; document.getElementById("scanHistory").innerHTML = '<div class="text-center text-muted py-2 small">Cleared</div>';
      });
    });
  </script>
</body>
</html>
